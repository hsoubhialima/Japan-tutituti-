<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japão 🌸 Roteiro</title>
<style>
  :root {
    --bg: #fdf6f8; --surface: #ffffff; --border: #f0d9e4; --text: #2a1a20;
    --text-muted: #9e7080; --accent: #c2517a; --accent-soft: #fdf0f4;
    --ink: #3d1a28; --high: #c2517a; --med: #e0923a; --low: #4aaa7a;
    --font-body: system-ui, -apple-system, sans-serif; --radius: 10px;
    --shadow: 0 2px 14px rgba(194,81,122,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: var(--font-body); background: var(--bg); color: var(--text); }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 360px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; z-index: 1000; }
  #sidebar-header { padding: 16px 20px 12px; background: var(--ink); color: white; }
  #sidebar-header h1 { font-family: Georgia, serif; font-size: 16px; font-weight: normal; letter-spacing: 0.03em; }
  #sidebar-header p { font-size: 11px; opacity: 0.5; margin-top: 2px; }
  #sync-status { font-size: 10px; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  #sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #888; flex-shrink: 0; }
  #sync-dot.online { background: #4aaa7a; } #sync-dot.syncing { background: #e0923a; } #sync-dot.error { background: #e05050; }
  #tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tab { flex: 1; padding: 9px 0; font-size: 11px; text-align: center; cursor: pointer; color: var(--text-muted); border: none; background: none; font-family: var(--font-body); border-bottom: 2px solid transparent; transition: all .15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .panel { flex: 1; overflow-y: auto; display: none; flex-direction: column; min-height: 0; }
  .panel.active { display: flex; }

  /* SEARCH */
  #search-wrap { padding: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #search-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--bg); font-family: var(--font-body); color: var(--text); outline: none; transition: border-color .15s; }
  #search-input:focus { border-color: var(--accent); }
  #pac-container { margin-top: 8px; }
  .pac-item-custom { padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; background: var(--bg); transition: all .12s; margin-bottom: 4px; }
  .pac-item-custom:hover { background: var(--accent-soft); border-color: var(--accent); }
  .pac-name { font-weight: 500; color: var(--text); }
  .pac-addr { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .pac-type { font-size: 10px; background: #f5eef1; color: #8a5068; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
  #place-preview { margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); display: none; }
  #preview-img { width: 100%; height: 120px; object-fit: cover; display: none; }
  #preview-img.loaded { display: block; }
  #preview-body { padding: 9px 12px; }
  #preview-name { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  #preview-addr { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  #preview-rating { font-size: 11px; color: var(--text-muted); }
  #add-form { padding: 12px; display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--border); background: var(--accent-soft); flex-shrink: 0; }
  #add-form.hidden { display: none; }
  .form-row { display: flex; flex-direction: column; gap: 3px; }
  .form-row label { font-size: 10px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .form-row input, .form-row textarea, .form-row select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); font-family: var(--font-body); color: var(--text); outline: none; transition: border-color .15s; }
  .form-row textarea { resize: vertical; min-height: 50px; }
  .priority-row { display: flex; gap: 5px; }
  .prio-btn { flex: 1; padding: 6px 0; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; font-family: var(--font-body); transition: all .12s; background: var(--surface); color: var(--text-muted); }
  .prio-btn.active-high { background: #fdeef3; color: var(--high); border-color: var(--high); font-weight: 500; }
  .prio-btn.active-med  { background: #fef4ec; color: var(--med);  border-color: var(--med);  font-weight: 500; }
  .prio-btn.active-low  { background: #edf7f2; color: var(--low);  border-color: var(--low);  font-weight: 500; }
  .form-actions { display: flex; gap: 8px; }
  .btn-save { flex: 1; padding: 9px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  .btn-cancel { padding: 9px 12px; background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  .search-hint { padding: 12px; font-size: 12px; color: var(--text-muted); line-height: 1.8; flex: 1; }
  .search-hint strong { color: var(--text); display: block; margin-bottom: 4px; }

  /* PLACES LIST */
  #places-scroll { flex: 1; overflow-y: auto; padding: 10px; }
  #route-bar { padding: 9px 12px; background: #fff8f0; border-bottom: 1px solid #f0d9c0; font-size: 12px; color: var(--text-muted); flex-shrink: 0; display: none; }
  #route-bar.visible { display: block; }
  #route-clear { margin-left: 8px; color: var(--accent); cursor: pointer; }
  #filters { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
  .filter-btn { font-size: 10px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; font-family: var(--font-body); }
  .filter-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
  .city-group { margin-bottom: 14px; }
  .city-group-header { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 2px 4px; border-bottom: 1px solid var(--border); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .city-group-header span { font-size: 10px; color: var(--text-muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .neighborhood-group { margin-bottom: 8px; }
  .neighborhood-label { font-size: 10px; color: var(--text-muted); padding: 3px 2px; font-style: italic; }
  .place-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px; cursor: pointer; transition: all .12s; background: var(--surface); border-left: 3px solid var(--border); margin-bottom: 5px; }
  .place-card:hover { box-shadow: var(--shadow); }
  .place-card.prio-alta { border-left-color: var(--high); } .place-card.prio-media { border-left-color: var(--med); } .place-card.prio-baixa { border-left-color: var(--low); } .place-card.prio-none { border-left-color: #ddd; }
  .place-card-top { display: flex; align-items: flex-start; gap: 6px; justify-content: space-between; }
  .place-card-name { font-size: 13px; font-weight: 500; flex: 1; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 5px; font-weight: 500; white-space: nowrap; }
  .badge-alta { background: #fdeef3; color: var(--high); } .badge-media { background: #fef4ec; color: var(--med); } .badge-baixa { background: #edf7f2; color: var(--low); } .badge-none { background: #f0f0f0; color: #999; }
  .place-card-desc { font-size: 11px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .place-card-actions { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
  .btn-sm { font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); background: none; cursor: pointer; font-family: var(--font-body); color: var(--text-muted); }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.sel { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-sm.danger { border-color: #f5c0cc; color: #cc4466; }
  #places-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.7; }

  /* ROTEIRO */
  #roteiro-scroll { flex: 1; overflow-y: auto; padding: 10px; }
  .day-block { margin-bottom: 16px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .day-header { padding: 10px 14px; background: var(--ink); color: white; display: flex; align-items: center; justify-content: space-between; }
  .day-header-left { display: flex; flex-direction: column; gap: 1px; }
  .day-date { font-size: 12px; font-weight: 500; }
  .day-city { font-size: 10px; opacity: 0.6; }
  .day-hotel { font-size: 10px; opacity: 0.5; font-style: italic; }
  .day-add-btn { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: none; color: white; cursor: pointer; font-family: var(--font-body); }
  .day-items { padding: 8px; min-height: 40px; }
  .day-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 5px; cursor: grab; }
  .day-item:active { cursor: grabbing; opacity: 0.7; }
  .day-item-icon { font-size: 14px; flex-shrink: 0; }
  .day-item-info { flex: 1; min-width: 0; }
  .day-item-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-item-note { font-size: 11px; color: var(--text-muted); }
  .day-item-prio { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .day-item-remove { font-size: 14px; color: var(--text-muted); cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
  .day-item-remove:hover { color: #cc4466; }
  .day-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px; font-style: italic; }
  .add-to-day-picker { background: #fff8fb; border-top: 1px solid var(--border); padding: 8px; display: none; }
  .add-to-day-picker.open { display: block; }
  .add-to-day-picker-title { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .place-picker-item { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12px; background: var(--surface); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .place-picker-item:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* DATA */
  #data-panel { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .data-btn { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: var(--font-body); text-align: left; }
  .data-btn-primary { background: var(--accent); color: white; border: none; }
  .data-btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .data-note { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  #import-file { display: none; }

  /* EDIT MODAL */
  #edit-modal-wrap { display: none; position: absolute; inset: 0; z-index: 2000; background: rgba(61,26,40,0.4); align-items: center; justify-content: center; }
  #edit-modal-wrap.open { display: flex; }
  #edit-modal { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 18px; width: 300px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 8px 32px rgba(194,81,122,0.18); }
  #edit-modal h3 { font-size: 14px; font-weight: 500; }

  #map { flex: 1; z-index: 0; }

  @media (max-width: 640px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; height: 55vh; border-right: none; border-top: 1px solid var(--border); order: 2; }
    #map { height: 45vh; order: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Japão 🌸 outubro 2026</h1>
      <p>Mapa colaborativo de viagem</p>
      <div id="sync-status"><div id="sync-dot"></div><span id="sync-label">conectando…</span></div>
    </div>
    <div id="tabs">
      <button class="tab active" onclick="showTab('search')">Buscar</button>
      <button class="tab" onclick="showTab('places')">Lugares</button>
      <button class="tab" onclick="showTab('roteiro')">Roteiro</button>
      <button class="tab" onclick="showTab('data')">Dados</button>
    </div>

    <div id="tab-search" class="panel active">
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="Ex: Fushimi Inari, Imperial Hotel…"/>
        <div id="pac-container"></div>
        <div id="place-preview">
          <img id="preview-img" alt=""/>
          <div id="preview-body">
            <div id="preview-name"></div>
            <div id="preview-addr"></div>
            <div id="preview-rating"></div>
          </div>
        </div>
      </div>
      <div id="add-form" class="hidden">
        <div class="form-row"><label>Nome</label><input id="form-name" type="text"/></div>
        <div class="form-row">
          <label>Cidade</label>
          <select id="form-city">
            <option value="Tokyo">Tóquio</option>
            <option value="Fuji">Região do Fuji</option>
            <option value="Kyoto">Kyoto</option>
            <option value="Osaka">Osaka</option>
            <option value="Nara">Nara</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="form-row"><label>Bairro / Área (opcional)</label><input id="form-neighborhood" type="text" placeholder="Ex: Arashiyama, Shinjuku…"/></div>
        <div class="form-row">
          <label>Categoria</label>
          <select id="form-cat">
            <option value="templo">⛩ Templo / Santuário</option>
            <option value="jardim">🌿 Jardim</option>
            <option value="museu">🏛 Museu / Galeria</option>
            <option value="restaurante">🍜 Restaurante</option>
            <option value="hotel">🏨 Hotel</option>
            <option value="natureza">🗻 Natureza</option>
            <option value="bairro">🏘 Bairro</option>
            <option value="mercado">🏪 Mercado</option>
            <option value="loja">🛍 Loja</option>
            <option value="outro">📍 Outro</option>
          </select>
        </div>
        <div class="form-row">
          <label>Prioridade</label>
          <div class="priority-row">
            <button class="prio-btn" id="prio-alta" onclick="setPrio('alta')">Alta</button>
            <button class="prio-btn" id="prio-media" onclick="setPrio('media')">Média</button>
            <button class="prio-btn" id="prio-baixa" onclick="setPrio('baixa')">Baixa</button>
          </div>
        </div>
        <div class="form-row"><label>Notas (opcional)</label><textarea id="form-notes" placeholder="Dicas, horários…"></textarea></div>
        <div class="form-actions">
          <button class="btn-save" onclick="savePlace()">Salvar no mapa</button>
          <button class="btn-cancel" onclick="cancelAdd()">Cancelar</button>
        </div>
      </div>
      <div class="search-hint"><strong>Como usar</strong>Digite o nome do lugar, clique no resultado, escolha cidade e categoria e salve!</div>
    </div>

    <div id="tab-places" class="panel">
      <div id="route-bar"><span id="route-info"></span><span id="route-clear" onclick="clearRoute()">✕ limpar</span></div>
      <div id="filters">
        <button class="filter-btn active" onclick="setFilter('todos',this)">Todos</button>
        <button class="filter-btn" onclick="setFilter('templo',this)">Templos</button>
        <button class="filter-btn" onclick="setFilter('jardim',this)">Jardins</button>
        <button class="filter-btn" onclick="setFilter('restaurante',this)">Restaurantes</button>
        <button class="filter-btn" onclick="setFilter('hotel',this)">Hotéis</button>
        <button class="filter-btn" onclick="setFilter('natureza',this)">Natureza</button>
        <button class="filter-btn" onclick="setFilter('mercado',this)">Mercados</button>
        <button class="filter-btn" onclick="setFilter('loja',this)">Lojas</button>
      </div>
      <div id="places-scroll"><div id="places-list"></div></div>
    </div>

    <div id="tab-roteiro" class="panel">
      <div id="roteiro-scroll" id="roteiro-list"></div>
    </div>

    <div id="tab-data" class="panel">
      <div id="data-panel">
        <p class="data-note" style="font-weight:500;color:var(--text)">Backup</p>
        <p class="data-note">Exporte e compartilhe com seu namorado para sincronizar.</p>
        <button class="data-btn data-btn-primary" onclick="exportData()">⬇ Exportar JSON</button>
        <button class="data-btn data-btn-secondary" onclick="document.getElementById('import-file').click()">⬆ Importar JSON</button>
        <input type="file" id="import-file" accept=".json" onchange="importData(event)"/>
        <div id="data-stats" style="font-size:12px;color:var(--text-muted);margin-top:4px"></div>
        <hr style="border:none;border-top:1px solid var(--border);margin-top:4px"/>
        <button class="data-btn" style="background:#fff0f3;color:#cc4466;border:1px solid #f5c0cc" onclick="if(confirm('Apagar tudo?'))clearAll()">Apagar tudo</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <div id="edit-modal-wrap">
    <div id="edit-modal">
      <h3 id="edit-modal-title">Editar lugar</h3>
      <div class="form-row"><label>Nome</label><input id="edit-name" type="text"/></div>
      <div class="form-row">
        <label>Cidade</label>
        <select id="edit-city">
          <option value="Tokyo">Tóquio</option>
          <option value="Fuji">Região do Fuji</option>
          <option value="Kyoto">Kyoto</option>
          <option value="Osaka">Osaka</option>
          <option value="Nara">Nara</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
      <div class="form-row"><label>Bairro / Área</label><input id="edit-neighborhood" type="text" placeholder="Ex: Arashiyama, Shinjuku…"/></div>
      <div class="form-row">
        <label>Categoria</label>
        <select id="edit-cat">
          <option value="templo">⛩ Templo / Santuário</option>
          <option value="jardim">🌿 Jardim</option>
          <option value="museu">🏛 Museu / Galeria</option>
          <option value="restaurante">🍜 Restaurante</option>
          <option value="hotel">🏨 Hotel</option>
          <option value="natureza">🗻 Natureza</option>
          <option value="bairro">🏘 Bairro</option>
          <option value="mercado">🏪 Mercado</option>
          <option value="loja">🛍 Loja</option>
          <option value="outro">📍 Outro</option>
        </select>
      </div>
      <div class="form-row">
        <label>Prioridade</label>
        <div class="priority-row">
          <button class="prio-btn" id="edit-prio-alta" onclick="setEditPrio('alta')">Alta</button>
          <button class="prio-btn" id="edit-prio-media" onclick="setEditPrio('media')">Média</button>
          <button class="prio-btn" id="edit-prio-baixa" onclick="setEditPrio('baixa')">Baixa</button>
        </div>
      </div>
      <div class="form-row"><label>Notas</label><textarea id="edit-notes"></textarea></div>
      <div class="form-actions">
        <button class="btn-save" onclick="saveEdit()">Salvar</button>
        <button class="btn-cancel" onclick="closeEdit()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const FIREBASE_CONFIG = {

  { date:'20 out', day:'Seg', city:'Kyoto', hotel:'Imperial Hotel Kyoto' },
  { date:'21 out', day:'Ter', city:'Osaka', hotel:'Four Seasons Osaka' },
  { date:'22 out', day:'Qua', city:'Osaka', hotel:'Four Seasons Osaka' },
];

const CITY_LABELS = { Tokyo:'Tóquio', Fuji:'Região do Fuji', Kyoto:'Kyoto', Osaka:'Osaka', Nara:'Nara', Outro:'Outro' };
const CITY_ORDER = ['Tokyo','Fuji','Kyoto','Osaka','Nara','Outro'];
const CAT_ICONS = { templo:'⛩', jardim:'🌿', museu:'🏛', restaurante:'🍜', hotel:'🏨', natureza:'🗻', bairro:'🏘', mercado:'🏪', loja:'🛍', outro:'📍' };
const PRIO_COLORS = { alta:'#c2517a', media:'#e0923a', baixa:'#4aaa7a', none:'#ccc' };
const PRIO_LABELS = { alta:'Alta', media:'Média', baixa:'Baixa', none:'— sem prioridade' };
const PRIO_MAP = { alta:'active-high', media:'active-med', baixa:'active-low' };

let places = {}, markers = {}, roteiro = {}, pendingPlace = null;
let selectedPrio = 'none', activeFilter = 'todos', routePoints = [], editingId = null;
let directionsRenderer = null, db = null, dbRef = null, roteiroRef = null;
let gmap = null, placesService = null, autocompleteService = null;
let openPickerDay = null;

function setSyncStatus(s,l){ document.getElementById('sync-dot').className=s; document.getElementById('sync-label').textContent=l; }

function pinSVG(prio, cat) {
  const c = PRIO_COLORS[prio]||PRIO_COLORS.none, e = CAT_ICONS[cat]||'📍';
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44"><path d="M18 0C8 0 0 8 0 18c0 12 18 26 18 26S36 30 36 18C36 8 28 0 18 0z" fill="${c}"/><circle cx="18" cy="18" r="11" fill="white" opacity="0.25"/><text x="18" y="23" text-anchor="middle" font-size="14">${e}</text></svg>`);
}

window.initMap = function() {
  gmap = new google.maps.Map(document.getElementById('map'), {
    center:{lat:36.2,lng:138.0}, zoom:6, mapTypeControl:false, fullscreenControl:false, streetViewControl:false,
    styles:[{featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]}]
  });
  placesService = new google.maps.places.PlacesService(gmap);
  autocompleteService = new google.maps.places.AutocompleteService();
  directionsRenderer = new google.maps.DirectionsRenderer({
    polylineOptions:{strokeColor:'#c2517a',strokeWeight:4,strokeOpacity:0.85}, suppressMarkers:true
  });
  directionsRenderer.setMap(gmap);
  setupSearch(); connectFirebase();
};

function setupSearch() {
  const input = document.getElementById('search-input');
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    const q = input.value.trim();
    if (!q) { document.getElementById('pac-container').innerHTML=''; return; }
    debounce = setTimeout(() => {
      autocompleteService.getPlacePredictions(
        {input:q, componentRestrictions:{country:'jp'}, language:'pt'},
        (predictions, status) => {
          const container = document.getElementById('pac-container');
          if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) {
            container.innerHTML='<div style="font-size:12px;color:var(--text-muted);padding:4px 0">Nenhum resultado.</div>'; return;
          }
          container.innerHTML = predictions.map(p=>`<div class="pac-item-custom" onclick="selectPrediction('${p.place_id}','${p.structured_formatting.main_text.replace(/'/g,"\\'")}')">
            <div class="pac-name">${p.structured_formatting.main_text}<span class="pac-type">${p.types?.[0]||''}</span></div>
            <div class="pac-addr">${p.structured_formatting.secondary_text||''}</div>
          </div>`).join('');
        }
      );
    }, 300);
  });
}

window.selectPrediction = function(placeId) {
  document.getElementById('pac-container').innerHTML='';
  document.getElementById('place-preview').style.display='block';
  document.getElementById('preview-name').textContent='Carregando…';
  document.getElementById('preview-addr').textContent='';
  document.getElementById('preview-rating').textContent='';
  document.getElementById('preview-img').classList.remove('loaded');
  placesService.getDetails({placeId, fields:['name','formatted_address','geometry','photos','rating','types','address_components']}, (place, status) => {
    if (status !== google.maps.places.PlacesServiceStatus.OK) return;
    pendingPlace = {lat:place.geometry.location.lat(), lng:place.geometry.location.lng(), name:place.name, address:place.formatted_address};
    gmap.panTo(place.geometry.location); gmap.setZoom(15);
    document.getElementById('preview-name').textContent = place.name;
    document.getElementById('preview-addr').textContent = place.formatted_address||'';
    document.getElementById('preview-rating').textContent = place.rating ? `⭐ ${place.rating}` : '';
    if (place.photos?.length) {
      const img = document.getElementById('preview-img');
      img.src = place.photos[0].getUrl({maxWidth:360,maxHeight:120});
      img.onload = () => img.classList.add('loaded');
    }
    document.getElementById('form-name').value = place.name;
    document.getElementById('add-form').classList.remove('hidden');
    setPrio('none');
    guessCategory(place.types||[]);
    guessCity(place.address_components||[], place.formatted_address||'');
  });
};

function guessCategory(types) {
  const map = {lodging:'hotel',restaurant:'restaurante',food:'restaurante',park:'jardim',museum:'museu',store:'loja',shopping_mall:'loja',supermarket:'mercado',grocery_or_supermarket:'mercado',place_of_worship:'templo',natural_feature:'natureza'};
  for (const t of types) { if (map[t]) { document.getElementById('form-cat').value=map[t]; return; } }
}

function guessCity(components, addr) {
  const cityMap = {
    '東京':'Tokyo','Tokyo':'Tokyo','Tóquio':'Tokyo',
    '京都':'Kyoto','Kyoto':'Kyoto',
    '大阪':'Osaka','Osaka':'Osaka',
    '奈良':'Nara','Nara':'Nara',
    '富士':'Fuji','Hakone':'Fuji','Fujikawaguchiko':'Fuji','Fuji':'Fuji'
  };
  for (const comp of components) {
    for (const [k,v] of Object.entries(cityMap)) { if (comp.long_name.includes(k)||comp.short_name.includes(k)) { document.getElementById('form-city').value=v; return; } }
  }
  for (const [k,v] of Object.entries(cityMap)) { if (addr.includes(k)) { document.getElementById('form-city').value=v; return; } }
}

function addMarker(p) {
  if (markers[p.id]) { markers[p.id].setMap(null); delete markers[p.id]; }
  const marker = new google.maps.Marker({
    position:{lat:p.lat,lng:p.lng}, map:gmap, title:p.name,
    icon:{url:pinSVG(p.priority||'none',p.category), scaledSize:new google.maps.Size(36,44)}
  });
  const info = new google.maps.InfoWindow({content:`<div style="font-family:system-ui;padding:4px;max-width:220px">
    <div style="font-weight:600;font-size:14px;color:#3d1a28;margin-bottom:4px">${p.name}</div>
    ${p.neighborhood?`<div style="font-size:11px;color:#9e7080;margin-bottom:4px">${p.neighborhood}${p.city?' · '+CITY_LABELS[p.city]:''}</div>`:''}
    <div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap">
      <span style="font-size:10px;background:#f5eef1;color:#8a5068;padding:2px 6px;border-radius:4px">${CAT_ICONS[p.category]||''} ${p.category||''}</span>
      <span style="font-size:10px;background:#fdeef3;color:#c2517a;padding:2px 6px;border-radius:4px">● ${PRIO_LABELS[p.priority||'none']}</span>
    </div>
    ${p.notes?`<div style="font-size:12px;color:#9e7080;line-height:1.5;margin-bottom:6px">${p.notes}</div>`:''}
    <button onclick="openEdit('${p.id}')" style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #f0d9e4;background:#fdf0f4;color:#c2517a;cursor:pointer">Editar</button>
  </div>`});
  marker.addListener('click', () => info.open(gmap, marker));
  markers[p.id] = marker;
}

function removeMarker(id) { if (markers[id]) { markers[id].setMap(null); delete markers[id]; } }

function renderList() {
  const container = document.getElementById('places-list');
  const arr = Object.values(places);
  const filtered = activeFilter==='todos' ? arr : arr.filter(p=>p.category===activeFilter);
  if (!filtered.length) { container.innerHTML='<div id="places-empty">Nenhum lugar salvo ainda.<br>Use a aba <em>Buscar</em> para adicionar.</div>'; updateStats(); return; }
  const order = {alta:0,media:1,baixa:2,none:3};
  const byCityNeighborhood = {};
  filtered.forEach(p => {
    const city = p.city||'Outro', nb = p.neighborhood||'';
    if (!byCityNeighborhood[city]) byCityNeighborhood[city]={};
    if (!byCityNeighborhood[city][nb]) byCityNeighborhood[city][nb]=[];
    byCityNeighborhood[city][nb].push(p);
  });
  CITY_ORDER.forEach(city => { if (byCityNeighborhood[city]) { Object.values(byCityNeighborhood[city]).forEach(arr => arr.sort((a,b)=>(order[a.priority||'none'])-(order[b.priority||'none']))); } });
  let html = '';
  CITY_ORDER.forEach(city => {
    if (!byCityNeighborhood[city]) return;
    const cityTotal = Object.values(byCityNeighborhood[city]).flat().length;
    html += `<div class="city-group"><div class="city-group-header">${CITY_LABELS[city]||city} <span>${cityTotal} lugar${cityTotal!==1?'es':''}</span></div>`;
    const nbs = Object.keys(byCityNeighborhood[city]).sort();
    nbs.forEach(nb => {
      const items = byCityNeighborhood[city][nb];
      if (nb) html += `<div class="neighborhood-group"><div class="neighborhood-label">📍 ${nb}</div>`;
      items.forEach(p => {
        const sel = routePoints.find(r=>r.id===p.id);
        const prio = p.priority||'none';
        html += `<div class="place-card prio-${prio}" onclick="flyTo('${p.id}')">
          <div class="place-card-top"><div class="place-card-name">${CAT_ICONS[p.category]||''} ${p.name}</div><span class="badge badge-${prio}">${PRIO_LABELS[prio]}</span></div>
          ${p.notes?`<div class="place-card-desc">${p.notes}</div>`:''}
          <div class="place-card-actions">
            <button class="btn-sm" onclick="event.stopPropagation();openEdit('${p.id}')">Editar</button>
            <button class="btn-sm ${sel?'sel':''}" onclick="event.stopPropagation();toggleRoute('${p.id}')">${sel?'✓ Na rota':'+ Rota'}</button>
            <button class="btn-sm danger" onclick="event.stopPropagation();deletePlace('${p.id}')">Remover</button>
          </div>
        </div>`;
      });
      if (nb) html += '</div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;
  updateStats();
}

function renderRoteiro() {
  const container = document.getElementById('roteiro-scroll');
  let html = '';
  DAYS.forEach((day, di) => {
    const key = `day_${di}`;
    const items = (roteiro[key]||[]).map(id=>places[id]).filter(Boolean);
    const pickerOpen = openPickerDay === di;
    const availablePlaces = Object.values(places).filter(p => !(roteiro[key]||[]).includes(p.id));
    html += `<div class="day-block">
      <div class="day-header">
        <div class="day-header-left">
          <div class="day-date">${day.day}, ${day.date} · ${CITY_LABELS[day.city]||day.city}</div>
          <div class="day-hotel">${day.hotel}</div>
        </div>
        <button class="day-add-btn" onclick="togglePicker(${di})">+ Adicionar</button>
      </div>
      <div class="day-items" id="day-items-${di}">
        ${items.length ? items.map((p,pi)=>`
          <div class="day-item" draggable="true" ondragstart="dragStart(event,${di},${pi})" ondragover="event.preventDefault()" ondrop="dragDrop(event,${di},${pi})">
            <div class="day-item-icon">${CAT_ICONS[p.category]||'📍'}</div>
            <div class="day-item-info">
              <div class="day-item-name">${p.name}</div>
              ${p.neighborhood?`<div class="day-item-note">${p.neighborhood}</div>`:''}
            </div>
            <div class="day-item-prio" style="background:${PRIO_COLORS[p.priority||'none']}"></div>
            <div class="day-item-remove" onclick="removeFromDay(${di},'${p.id}')">✕</div>
          </div>`).join('') : `<div class="day-empty">Nenhum lugar adicionado</div>`}
      </div>
      <div class="add-to-day-picker ${pickerOpen?'open':''}" id="picker-${di}">
        <div class="add-to-day-picker-title">Escolha um lugar para adicionar:</div>
        ${availablePlaces.length ? availablePlaces.map(p=>`
          <div class="place-picker-item" onclick="addToDay(${di},'${p.id}')">
            <span>${CAT_ICONS[p.category]||'📍'}</span>
            <span style="flex:1;font-size:12px">${p.name}</span>
            <span style="font-size:10px;color:var(--text-muted)">${CITY_LABELS[p.city]||p.city||''}</span>
          </div>`).join('') : '<div style="font-size:12px;color:var(--text-muted);padding:4px">Todos os lugares já foram adicionados.</div>'}
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

window.togglePicker = function(di) { openPickerDay = openPickerDay===di ? null : di; renderRoteiro(); };

window.addToDay = async function(di, placeId) {
  const key = `day_${di}`;
  const current = roteiro[key]||[];
  if (!current.includes(placeId)) {
    roteiro[key] = [...current, placeId];
    await saveRoteiro();
  }
  openPickerDay = null; renderRoteiro();
};

window.removeFromDay = async function(di, placeId) {
  const key = `day_${di}`;
  roteiro[key] = (roteiro[key]||[]).filter(id=>id!==placeId);
  await saveRoteiro(); renderRoteiro();
};

let dragSrc = null;
window.dragStart = function(e, di, pi) { dragSrc={di,pi}; };
window.dragDrop = function(e, di, pi) {
  if (!dragSrc || dragSrc.di!==di) return;
  const key=`day_${di}`, arr=[...(roteiro[key]||[])];
  const [item]=arr.splice(dragSrc.pi,1); arr.splice(pi,0,item);
  roteiro[key]=arr; saveRoteiro(); renderRoteiro();
};

async function saveRoteiro() {
  if (roteiroRef) { await set(roteiroRef, roteiro); }
  else { localStorage.setItem('japan_roteiro_local', JSON.stringify(roteiro)); }
}

window.flyTo = function(id) {
  const p=places[id]; if(!p) return;
  gmap.panTo({lat:p.lat,lng:p.lng}); gmap.setZoom(15);
  if(markers[id]) google.maps.event.trigger(markers[id],'click');
};

async function writePlace(p) {
  if (db) { setSyncStatus('syncing','sincronizando…'); await set(ref(db,`places/${p.id}`),p); }
  else { places[p.id]=p; saveLocal(); addMarker(p); renderList(); }
}

async function erasePlace(id) {
  if (db) { setSyncStatus('syncing','sincronizando…'); await remove(ref(db,`places/${id}`)); }
  else { delete places[id]; removeMarker(id); saveLocal(); renderList(); }
}

window.deletePlace = async function(id) {
  if (!confirm('Remover este lugar?')) return;
  routePoints=routePoints.filter(r=>r.id!==id);
  DAYS.forEach((_,di)=>{ const key=`day_${di}`; if(roteiro[key]) roteiro[key]=roteiro[key].filter(x=>x!==id); });
  await saveRoteiro(); await erasePlace(id); updateRouteUI();
};

window.clearAll = async function() {
  if (db) { await set(ref(db,'places'),null); await set(roteiroRef,null); }
  else { places={}; Object.keys(markers).forEach(id=>{markers[id].setMap(null);}); markers={}; roteiro={}; saveLocal(); localStorage.removeItem('japan_roteiro_local'); }
  routePoints=[]; clearRoute(); renderList(); renderRoteiro();
};

window.cancelAdd = function() {
  pendingPlace=null;
  document.getElementById('add-form').classList.add('hidden');
  document.getElementById('place-preview').style.display='none';
  document.getElementById('search-input').value='';
};

window.setPrio = function(p) {
  selectedPrio=p;
  ['alta','media','baixa'].forEach(x=>document.getElementById('prio-'+x).className='prio-btn');
  if(p!=='none') document.getElementById('prio-'+p).className='prio-btn '+PRIO_MAP[p];
};

window.savePlace = async function() {
  if (!pendingPlace) return;
  const name=document.getElementById('form-name').value.trim();
  if (!name) { alert('Adicione um nome'); return; }
  const place={
    id:Date.now().toString(), name,
    city:document.getElementById('form-city').value,
    neighborhood:document.getElementById('form-neighborhood').value.trim(),
    category:document.getElementById('form-cat').value,
    priority:selectedPrio,
    notes:document.getElementById('form-notes').value.trim(),
    lat:pendingPlace.lat, lng:pendingPlace.lng
  };
  await writePlace(place);
  cancelAdd(); document.getElementById('form-notes').value=''; document.getElementById('form-neighborhood').value='';
  showTab('places');
};

window.setFilter = function(f,btn) {
  activeFilter=f; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderList();
};

window.toggleRoute = function(id) {
  const p=places[id]; if(!p) return;
  const idx=routePoints.findIndex(r=>r.id===id);
  if(idx!==-1){routePoints.splice(idx,1);}else{if(routePoints.length>=2)routePoints.shift();routePoints.push({id,lat:p.lat,lng:p.lng,name:p.name});}
  renderList(); updateRouteUI();
};

function updateRouteUI() {
  const bar=document.getElementById('route-bar');
  if(!routePoints.length){bar.classList.remove('visible');directionsRenderer.setDirections({routes:[]});return;}
  bar.classList.add('visible');
  if(routePoints.length===1){document.getElementById('route-info').innerHTML=`<strong>${routePoints[0].name}</strong> → escolha o destino`;return;}
  document.getElementById('route-info').innerHTML=`<strong>${routePoints[0].name}</strong> → <strong>${routePoints[1].name}</strong>`;
  new google.maps.DirectionsService().route(
    {origin:routePoints[0],destination:routePoints[1],travelMode:google.maps.TravelMode.WALKING},
    (result,status)=>{if(status==='OK')directionsRenderer.setDirections(result);}
  );
}

window.clearRoute = function() {
  routePoints=[]; document.getElementById('route-bar').classList.remove('visible');
  try{directionsRenderer.setDirections({routes:[]});}catch(e){} renderList();
};

window.showTab = function(t) {
  const tabs=['search','places','roteiro','data'];
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll('.tab')[tabs.indexOf(t)].classList.add('active');
  if(t==='places') renderList();
  if(t==='roteiro') renderRoteiro();
  if(t==='data') updateStats();
};

window.openEdit = function(id) {
  const p=places[id]; if(!p) return;
  editingId=id;
  document.getElementById('edit-modal-title').textContent=p.name;
  document.getElementById('edit-name').value=p.name;
  document.getElementById('edit-city').value=p.city||'Outro';
  document.getElementById('edit-neighborhood').value=p.neighborhood||'';
  document.getElementById('edit-cat').value=p.category||'outro';
  document.getElementById('edit-notes').value=p.notes||'';
  setEditPrio(p.priority||'none');
  document.getElementById('edit-modal-wrap').classList.add('open');
};

window.closeEdit = function() { editingId=null; document.getElementById('edit-modal-wrap').classList.remove('open'); };

window.setEditPrio = function(p) {
  ['alta','media','baixa'].forEach(x=>document.getElementById('edit-prio-'+x).className='prio-btn');
  if(p!=='none') document.getElementById('edit-prio-'+p).className='prio-btn '+PRIO_MAP[p];
  document.getElementById('edit-modal-wrap').dataset.prio=p;
};

window.saveEdit = async function() {
  if(!editingId) return;
  const name=document.getElementById('edit-name').value.trim();
  if(!name){alert('Nome não pode estar vazio');return;}
  const p={...places[editingId], name, city:document.getElementById('edit-city').value,
    neighborhood:document.getElementById('edit-neighborhood').value.trim(),
    category:document.getElementById('edit-cat').value,
    priority:document.getElementById('edit-modal-wrap').dataset.prio||'none',
    notes:document.getElementById('edit-notes').value.trim()};
  closeEdit(); await writePlace(p);
};

window.exportData = function() {
  const data={places:Object.values(places),roteiro};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='japao-roteiro.json';a.click();
};

window.importData = function(e) {
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=async ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      const imported=Array.isArray(data)?data:(data.places||[]);
      let added=0;
      for(const p of imported){if(!places[p.id]){await writePlace(p);added++;}}
      if(data.roteiro){roteiro={...data.roteiro};await saveRoteiro();}
      alert(`${added} lugar${added!==1?'es':''} importado${added!==1?'s':''}!`);
    }catch{alert('Arquivo inválido.');}
  };
  r.readAsText(file);e.target.value='';
};

function saveLocal(){localStorage.setItem('japan_places_local',JSON.stringify(places));}
function loadLocal(){
  try{const r=localStorage.getItem('japan_places_local');if(r)places=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem('japan_roteiro_local');if(r)roteiro=JSON.parse(r);}catch(e){}
}

function updateStats(){
  const el=document.getElementById('data-stats');if(!el)return;
  const arr=Object.values(places);
  el.textContent=`${arr.length} lugar${arr.length!==1?'es':''} · ${arr.filter(p=>p.priority==='alta').length} de alta prioridade`;
}

function connectFirebase(){
  try{
    const app=initializeApp(FIREBASE_CONFIG);
    db=getDatabase(app);
    dbRef=ref(db,'places');
    roteiroRef=ref(db,'roteiro');
    onValue(dbRef,snapshot=>{
      const data=snapshot.val()||{};
      Object.keys(markers).forEach(id=>{if(!data[id])removeMarker(id);});
      Object.values(data).forEach(p=>{places[p.id]=p;addMarker(p);});
      places={...data}; saveLocal(); renderList();
      setSyncStatus('online','sincronizado ✓');
    },()=>setSyncStatus('error','erro de conexão'));
    onValue(roteiroRef,snapshot=>{
      roteiro=snapshot.val()||{};
      localStorage.setItem('japan_roteiro_local',JSON.stringify(roteiro));
    });
  }catch(e){setSyncStatus('error','erro Firebase');}
}

loadLocal();
</script>
